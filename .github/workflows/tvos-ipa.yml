name: tvOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Creating a release and uploading the IPA needs write access to the repo.
permissions:
  contents: write

concurrency:
  group: tvos-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build tvOS Release IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Read app version
        working-directory: apps/tvos
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"$/\1/p' project.yml)
          build=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\(.*\)"$/\1/p' project.yml)

          if [ -z "$version" ] || [ -z "$build" ]; then
            echo "::error::Could not read MARKETING_VERSION / CURRENT_PROJECT_VERSION from project.yml"
            exit 1
          fi

          echo "App version: $version ($build)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

          # A tag build must never publish a binary whose version disagrees
          # with the tag that names it.
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${version}"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/tvos
        run: xcodegen generate

      - name: Show schemes
        working-directory: apps/tvos
        run: |
          xcodebuild \
            -project PatreonTV.xcodeproj \
            -list

      - name: Archive tvOS app
        working-directory: apps/tvos
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project PatreonTV.xcodeproj \
            -scheme PatreonTV \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath "$PWD/build/PatreonTV.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            > build/archive.log 2>&1

      - name: Show archive contents
        working-directory: apps/tvos
        run: |
          echo "=== Archive ==="
          find build/PatreonTV.xcarchive -maxdepth 5 -print

      - name: Locate application
        working-directory: apps/tvos
        run: |
          APP=$(find build/PatreonTV.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::PatreonTV.app was not found in the archive"
            exit 1
          fi

          echo "Found application:"
          echo "$APP"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        working-directory: apps/tvos
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload

          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          zip -r "../PatreonTV-${APP_VERSION}-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatreonTV-unsigned
          path: apps/tvos/build/PatreonTV-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        # Only tag builds publish; manual runs just produce the artifact.
        if: github.ref_type == 'tag'
        working-directory: apps/tvos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          ipa="build/PatreonTV-${APP_VERSION}-unsigned.ipa"
          notes=$(mktemp)

          # Release notes are the CHANGELOG section for this version, so the
          # notes and the tag can never drift apart.
          awk -v heading="## [${APP_VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' ../../CHANGELOG.md > "$notes"

          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for ${APP_VERSION}"
            exit 1
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; uploading IPA"
            gh release upload "$tag" "$ipa" --clobber
          else
            gh release create "$tag" "$ipa" \
              --verify-tag \
              --title "PatreonTV ${APP_VERSION}" \
              --notes-file "$notes"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PatreonTV-build-log
          path: apps/tvos/build/archive.log
          if-no-files-found: ignore
          retention-days: 7
