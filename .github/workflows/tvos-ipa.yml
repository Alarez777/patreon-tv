name: tvOS IPA

on:
  workflow_dispatch:

concurrency:
  group: tvos-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build tvOS Release IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/tvos
        run: xcodegen generate

      - name: Show schemes
        working-directory: apps/tvos
        run: |
          xcodebuild \
            -project PatreonTV.xcodeproj \
            -list

      - name: Archive tvOS app
        working-directory: apps/tvos
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project PatreonTV.xcodeproj \
            -scheme PatreonTV \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath "$PWD/build/PatreonTV.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            > build/archive.log 2>&1

      - name: Show archive contents
        working-directory: apps/tvos
        run: |
          echo "=== Archive ==="
          find build/PatreonTV.xcarchive -maxdepth 5 -print

      - name: Locate application
        working-directory: apps/tvos
        run: |
          APP=$(find build/PatreonTV.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::PatreonTV.app was not found in the archive"
            exit 1
          fi

          echo "Found application:"
          echo "$APP"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        working-directory: apps/tvos
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload

          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          zip -r ../PatreonTV-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PatreonTV-unsigned
          path: apps/tvos/build/PatreonTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PatreonTV-build-log
          path: apps/tvos/build/archive.log
          if-no-files-found: ignore
          retention-days: 7
